<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SVG is primary (scales, matches the real Alongside mark exactly --
         white badge, black vector, per explicit request, not this app's
         own dark/light theme, which favicons don't participate in
         regardless). The 16x16 PNG is the dedicated small-size export, not
         a browser-scaled-down larger image, for the sharpest possible tab
         icon on displays/browsers that don't use the SVG; .ico is the
         final fallback for anything that supports neither. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Alongside</title>
    <!-- Applies the dark class before the browser's first paint, not just
         in use-theme.ts's React effect -- that effect only runs after
         mount, so with no class present in this raw HTML, the browser was
         painting the light/white theme first and only flipping to dark a
         moment later, showing as a white flash on every load/reload. A
         tiny synchronous (non-module, non-deferred) inline script here
         runs and blocks before any rendering, so the class is already
         correct by the time anything paints. Reads the same alongside_theme
         key and resolves it the same way use-theme.ts's
         getStoredTheme/resolveTheme do (default dark, "system" consults
         prefers-color-scheme) -- kept in sync manually since this has to
         run standalone, before any React module is even fetched. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("alongside_theme");
          var isDark =
            stored === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
              : stored !== "light";
          if (isDark) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
