<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Porch</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="fixed left-0 top-0 bottom-0 w-[47px] flex flex-col items-center py-[18px] border-r border-porch-border z-10">
    <img class="sidebar-logo" src="/logo.svg" alt="Porch" />
    <button class="sidebar-icon-btn" title="New session" onclick="location.href='/'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div class="sidebar-avatar mt-auto" id="sidebarAvatar"></div>
  </div>

  <div class="h-screen flex flex-col ml-[47px]">
    <div class="flex items-center justify-end px-5 py-3.5 border-b border-porch-border shrink-0">
      <div class="flex items-center gap-2.5">
        <button class="plain-btn bg-porch-btn border-porch-btn text-white hover:bg-porch-btn-hover text-sm" id="shareBtn" onclick="shareSession()">Share</button>
        <button class="bg-transparent border-0 text-porch-muted flex items-center gap-1 p-1 cursor-pointer">
          <span class="sidebar-avatar w-6 h-6 text-[0.65rem]"></span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
    </div>
    <div id="chatLog" class="flex-1 overflow-y-auto flex flex-col gap-2 p-5 max-w-3xl w-full mx-auto"></div>
    <div class="shrink-0 border-t border-porch-border px-5 pt-4 pb-6">
      <div class="compose-box max-w-3xl mx-auto">
        <textarea id="messageInput" rows="1" placeholder="Message" onkeydown="if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"></textarea>
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-1.5">
            <span class="model-label" id="chatModelChip">Default</span>
          </div>
          <button class="send-btn" onclick="sendMessage()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 10-5 5 5 5"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Placeholder sign-in gate (Sprint 5 hasn't landed real auth yet).
    if (!localStorage.getItem("porch_signed_in")) {
      location.href = "/auth";
    }

    const currentSessionId = location.pathname.split("/").pop();

    document.getElementById("chatModelChip").textContent = sessionStorage.getItem("porch_model_label") || "—";
    sessionStorage.removeItem("porch_model_label");

    async function sendMessage() {
      const input = document.getElementById("messageInput");
      const message = input.value.trim();
      if (!message) {
        return;
      }

      const res = await fetch(`/sessions/${currentSessionId}/messages`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: message }),
      });

      if (!res.ok) {
        alert("Failed to send message (status " + res.status + ").");
        return;
      }

      input.value = "";
    }

    function shareSession() {
      const link = `${location.origin}/session/${currentSessionId}`;
      navigator.clipboard.writeText(link);

      const btn = document.getElementById("shareBtn");
      const original = btn.textContent;
      btn.textContent = "Copied!";
      setTimeout(() => { btn.textContent = original; }, 1500);
    }

    function addMarker(text) {
      const chatLog = document.getElementById("chatLog");
      const el = document.createElement("div");
      el.className = "opacity-50 text-sm text-center";
      el.textContent = text;
      chatLog.appendChild(el);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function addBubble(text) {
      const chatLog = document.getElementById("chatLog");
      const el = document.createElement("div");
      el.className = "bg-porch-card border-l-[3px] border-porch-border rounded-lg px-3.5 py-2.5 whitespace-pre-wrap";
      el.textContent = text;
      chatLog.appendChild(el);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function addToolNote(text) {
      const chatLog = document.getElementById("chatLog");
      const el = document.createElement("div");
      el.className = "opacity-70 text-sm italic";
      el.textContent = text;
      chatLog.appendChild(el);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    // Renders a single streamed event (the SDK's raw Message JSON) as a chat-log entry,
    // instead of dumping the raw JSON, so the session reads like a real chat transcript.
    function renderEvent(raw) {
      let event;
      try {
        event = JSON.parse(raw);
      } catch (e) {
        addMarker(raw);
        return;
      }

      if (event.type === "system") {
        addMarker("Session started");
        return;
      }

      if (event.type === "result") {
        addMarker("Session ended");
        return;
      }

      if (event.type === "assistant" && event.message && event.message.content) {
        for (const block of event.message.content) {
          if (block.type === "text") {
            addBubble(block.text);
          } else if (block.type === "tool_use") {
            addToolNote(`Used tool: ${block.name}`);
          }
        }
        return;
      }

      // Fallback for any event shape not explicitly handled above.
      addMarker(raw);
    }

    const ws = new WebSocket(`ws://${location.host}/sessions/${currentSessionId}/ws`);

    ws.onmessage = (event) => {
      renderEvent(event.data);
    };

    ws.onerror = () => {
      addMarker("WebSocket error, is the session ID correct?");
    };
  </script>
</body>
</html>
